[project]
name = "edainsights"
version = "0.1.0"
description = "Config-driven EDA-to-Insights pipeline for tabular datasets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
]

[project.scripts]
edainsights = "edainsights.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
